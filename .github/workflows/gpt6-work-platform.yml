name: GPT-6 Work platform offline checks
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/skills/gpt6-work-platform/**'
      - '.github/workflows/gpt6-work-platform.yml'
      - 'docs/gpt6-work-platform.md'
  push:
    branches: ['work/gpt6-platform-20260905']
    paths:
      - '.agents/skills/gpt6-work-platform/**'
      - '.github/workflows/gpt6-work-platform.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m py_compile .agents/skills/gpt6-work-platform/scripts/*.py
      - name: Offline tests
        run: python -m unittest discover -s .agents/skills/gpt6-work-platform/tests -v
      - name: Synthetic integration smoke
        run: python .agents/skills/gpt6-work-platform/scripts/smoke.py
