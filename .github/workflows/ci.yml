name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax checks
        run: |
          bash -n factory.sh
          bash -n install.sh
          find factory -type f -name "*.sh" -print0 | xargs -0 -I{} bash -n "{}"

      - name: Python syntax checks
        run: |
          find factory diagnostics evolution_eval -type f -name "*.py" -print0 | xargs -0 python3 -m py_compile

      - name: Luna swarm research tests
        run: |
          python3 -m unittest discover -s factory/swarm/tests -p 'test_*.py' -v

      - name: Revenue observation and follow-up tests
        run: |
          python3 -m unittest discover -s factory/revenue/tests -v

  revenue-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify artifacts with real network isolation
        run: python3 -m factory.revenue.control.isolation_acceptance
